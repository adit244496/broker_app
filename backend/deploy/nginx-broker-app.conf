# Nginx site for the broker app on neocp.ambujaneotia.com: admin portal at /, API at /api/.
#
#   https://neocp.ambujaneotia.com/        admin portal  (static files in /var/www/broker-admin)
#   https://neocp.ambujaneotia.com/api/    backend API   (uvicorn on 127.0.0.1:8019, /api prefix stripped)
#
# This VM hosts other sites on 80/443, so this one is matched by server_name only (never default_server).
# Never remove other files from sites-enabled: they belong to other apps on this server.
#
# Install:  sudo cp deploy/nginx-broker-app.conf /etc/nginx/sites-available/broker-neocp
#           sudo ln -sf /etc/nginx/sites-available/broker-neocp /etc/nginx/sites-enabled/broker-neocp
#           sudo nginx -t && sudo systemctl reload nginx
#           sudo certbot --nginx -d neocp.ambujaneotia.com      # adds HTTPS + HTTP->HTTPS redirect
#
# Apps and .env use https://neocp.ambujaneotia.com/api as the API base URL (PUBLIC_BASE_URL,
# EXPO_PUBLIC_API_BASE_URL, VITE_API_BASE_URL).

# Login and OTP endpoints only: a per-IP limit at the proxy, since the app's own limits are per worker.
# Generous, because testers in one office share a public IP; the app still limits per mobile/email.
limit_req_zone $binary_remote_addr zone=broker_auth:10m rate=30r/m;

server {
    listen 80;
    listen [::]:80;
    server_name neocp.ambujaneotia.com;

    # Project cover images are up to 5 MB.
    client_max_body_size 10m;

    access_log /var/log/nginx/broker-neocp.access.log;
    error_log  /var/log/nginx/broker-neocp.error.log;

    # ------------------------------------------------------------ API (/api/... -> backend /...)
    location = /api { return 301 /api/; }

    location ~ ^/api/(auth/otp/|auth/password-login|admin/auth/login) {
        limit_req zone=broker_auth burst=20 nodelay;
        limit_req_status 429;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://127.0.0.1:8019;
        include /etc/nginx/snippets/broker-proxy.conf;
    }

    location /api/ {
        # The trailing slash strips /api: /api/health -> /health
        proxy_pass http://127.0.0.1:8019/;
        include /etc/nginx/snippets/broker-proxy.conf;
    }

    # ------------------------------------------------------------ Admin portal (static build of admin/)
    root /var/www/broker-admin;
    index index.html;

    # Hashed build assets never change: cache them for a long time.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Single-page app: unknown paths load index.html and the router takes over.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
