# Nginx site for the backend API and the admin portal.
#
# This VM hosts other sites on 80/443, and Azure only lets 80, 443 and 8080 in. So this app shares ports 80/443
# by hostname (never default_server), using free sslip.io names that resolve to the VM's IP until the real
# domain arrives:
#   API           https://broker-api.4-224-153-24.sslip.io    ->  uvicorn on 127.0.0.1:8019 (broker-api.service)
#   Admin portal  https://broker-admin.4-224-153-24.sslip.io  ->  static files in /var/www/broker-admin
# HTTPS: sudo certbot --nginx -d broker-api.4-224-153-24.sslip.io -d broker-admin.4-224-153-24.sslip.io
#
# Install:  sudo cp deploy/broker-proxy.conf /etc/nginx/snippets/broker-proxy.conf
#           sudo cp deploy/nginx-broker-app.conf /etc/nginx/sites-available/broker-app
#           sudo ln -sf /etc/nginx/sites-available/broker-app /etc/nginx/sites-enabled/broker-app
#           sudo nginx -t && sudo systemctl reload nginx
# Never remove other files from sites-enabled: they belong to other apps on this server.
#
# When the domain arrives: replace the server_name values (e.g. api.example.com / admin.example.com) and run
# certbot again for the new names.

# Login and OTP endpoints only: a per-IP limit at the proxy, since the app's own limits are per worker.
# Generous, because testers in one office share a public IP; the app still limits per mobile/email.
limit_req_zone $binary_remote_addr zone=broker_auth:10m rate=30r/m;

# ---------------------------------------------------------------- API
server {
    listen 80;
    listen [::]:80;
    server_name broker-api.4-224-153-24.sslip.io;

    # Project cover images are up to 5 MB.
    client_max_body_size 10m;

    access_log /var/log/nginx/broker-api.access.log;
    error_log  /var/log/nginx/broker-api.error.log;

    location ~ ^/auth/(otp/|password-login) {
        limit_req zone=broker_auth burst=20 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8019;
        include /etc/nginx/snippets/broker-proxy.conf;
    }

    location = /admin/auth/login {
        limit_req zone=broker_auth burst=20 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8019;
        include /etc/nginx/snippets/broker-proxy.conf;
    }

    location / {
        proxy_pass http://127.0.0.1:8019;
        include /etc/nginx/snippets/broker-proxy.conf;
    }
}

# ---------------------------------------------------------------- Admin portal (static build of admin/)
server {
    listen 80;
    listen [::]:80;
    server_name broker-admin.4-224-153-24.sslip.io;

    # Copied here from admin/dist (Nginx can't read files under /home/srvadmin).
    root /var/www/broker-admin;
    index index.html;

    access_log /var/log/nginx/broker-admin.access.log;
    error_log  /var/log/nginx/broker-admin.error.log;

    # Hashed build assets never change: cache them for a long time.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Single-page app: unknown paths load index.html and the router takes over.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
